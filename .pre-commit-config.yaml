# Pre-commit hooks: run locally before each commit to stop secrets at the door.
# Install once:      pre-commit install
# Run on all files:  pre-commit run --all-files
# Docs: https://pre-commit.com
#
# Notes:
# - detect-secrets is pure Python, so it works everywhere with no extra tools.
# - gitleaks runs in CI (.github/workflows/secret-scan.yml). If you also want it
#   locally, install Go (https://go.dev) or run Docker and add the gitleaks
#   block at the bottom of this file (see comment).

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(uv\.lock|\.secrets\.baseline)$

  # Optional: enable gitleaks locally too. Requires Go (or use id: gitleaks-docker
  # with a running Docker daemon). It is already enforced in CI regardless.
  #
  # - repo: https://github.com/gitleaks/gitleaks
  #   rev: v8.30.1
  #   hooks:
  #     - id: gitleaks
