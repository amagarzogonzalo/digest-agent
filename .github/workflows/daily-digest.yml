name: Daily GitHub Digest

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily -- adjust to your timezone
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run digest bot
        env:
          GITHUB_TOKEN: ${{ secrets.DIGEST_GH_TOKEN }}
          GITHUB_REPOS: ${{ vars.GITHUB_REPOS }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '1' }}
          # Provider fallback chain (Groq -> Mistral -> OpenRouter).
          # Only providers with a key configured are used; all are free.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # SMTP relay (defaults to Gmail). Ethereal example:
          NOTIFIER: ${{ vars.NOTIFIER || 'smtp' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Resend (used when NOTIFIER=resend)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python -m digest_agent.main