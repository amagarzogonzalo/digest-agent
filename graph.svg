<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <style>
    .title{font-size:20px;font-weight:700;fill:#0f172a}
    .subtitle{font-size:12.5px;fill:#64748b}
    .band{font-size:11px;font-weight:700;fill:#94a3b8;letter-spacing:.02em}
    .nodeTitle{font-size:12px;font-weight:600;fill:#0f172a}
    .nodeSub{font-size:9.5px;fill:#64748b}
    .edgeLbl{font-size:9.5px;fill:#64748b;font-style:italic}
    .edgeLblRed{font-size:9.5px;fill:#b91c1c;font-style:italic}
    .legend{font-size:10.5px;fill:#334155}
    .edge{stroke:#64748b;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
    .edgeLoop{stroke:#b91c1c;stroke-width:1.4;fill:none;stroke-dasharray:5,3;marker-end:url(#arrowRed)}
    .node{stroke-width:1.4}
  </style>

  <rect x="0" y="0" width="1200" height="740" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="34" class="title">MR Digest Pipeline</text>
  <text x="40" y="53" class="subtitle">LangGraph workflow — GitHub activity → parallel MR analysis → multi-pass review → PDF digest</text>

  <!-- ===== Band 1: INGEST ===== -->
  <text x="110" y="76" class="band">Ingest</text>
  <rect x="30" y="86" width="160" height="48" rx="10" class="node" fill="#e1effe" stroke="#1d4ed8"/>
  <text x="110" y="106" text-anchor="middle" class="nodeTitle">fetch_github</text>
  <text x="110" y="120" text-anchor="middle" class="nodeSub">activity + diffs</text>

  <rect x="230" y="86" width="160" height="48" rx="10" class="node" fill="#e1effe" stroke="#1d4ed8"/>
  <text x="310" y="106" text-anchor="middle" class="nodeTitle">set_metadata</text>
  <text x="310" y="120" text-anchor="middle" class="nodeSub">assign uid / version</text>

  <rect x="430" y="86" width="160" height="48" rx="10" class="node" fill="#e1effe" stroke="#1d4ed8"/>
  <text x="510" y="104" text-anchor="middle" class="nodeTitle">select_and_test</text>
  <text x="510" y="117" text-anchor="middle" class="nodeTitle">_model</text>

  <rect x="680" y="86" width="160" height="48" rx="10" class="node" fill="#fde2e2" stroke="#b91c1c"/>
  <text x="760" y="106" text-anchor="middle" class="nodeTitle">handle_failure</text>
  <text x="760" y="120" text-anchor="middle" class="nodeSub">alert + abort run</text>

  <path class="edge" d="M190,110 L230,110"/>
  <path class="edge" d="M390,110 L430,110"/>
  <path class="edgeLoop" d="M590,102 L680,102"/>
  <text x="635" y="94" text-anchor="middle" class="edgeLblRed">fail</text>

  <!-- ===== Band 2: GENERATE (fan-out) ===== -->
  <text x="110" y="176" class="band">Generate — k× parallel</text>
  <rect x="80" y="184" width="220" height="196" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>

  <rect x="100" y="200" width="160" height="46" rx="10" class="node" fill="#e7f6ec" stroke="#15803d"/>
  <text x="180" y="219" text-anchor="middle" class="nodeTitle">MR loop 1</text>
  <text x="180" y="232" text-anchor="middle" class="nodeSub">dive → review → refine</text>

  <rect x="100" y="258" width="160" height="46" rx="10" class="node" fill="#e7f6ec" stroke="#15803d"/>
  <text x="180" y="277" text-anchor="middle" class="nodeTitle">MR loop 2</text>
  <text x="180" y="290" text-anchor="middle" class="nodeSub">dive → review → refine</text>

  <rect x="100" y="316" width="160" height="46" rx="10" class="node" fill="#e7f6ec" stroke="#15803d"/>
  <text x="180" y="335" text-anchor="middle" class="nodeTitle">MR loop k</text>
  <text x="180" y="348" text-anchor="middle" class="nodeSub">dive → review → refine</text>

  <!-- fan out from select_and_test_model -->
  <path class="edge" d="M470,134 C420,168 320,190 262,220"/>
  <path class="edge" d="M470,134 C440,190 340,255 262,280"/>
  <path class="edge" d="M470,134 C460,230 370,310 262,338"/>
  <text x="430" y="160" text-anchor="middle" class="edgeLbl">pass</text>

  <!-- ===== Band 3: REVIEW & REFINE ===== -->
  <text x="440" y="398" class="band" text-anchor="middle">Review &amp; refine</text>

  <rect x="30" y="410" width="160" height="48" rx="10" class="node" fill="#e7f6ec" stroke="#15803d"/>
  <text x="110" y="430" text-anchor="middle" class="nodeTitle">combine</text>
  <text x="110" y="444" text-anchor="middle" class="nodeSub">final merge loop</text>

  <!-- convergence from loops into combine -->
  <path class="edge" d="M155,246 C120,300 78,350 70,410"/>
  <path class="edge" d="M180,304 C150,340 108,375 110,410"/>
  <path class="edge" d="M205,362 C190,385 160,398 150,410"/>

  <rect x="230" y="410" width="160" height="48" rx="10" class="node" fill="#fff4e5" stroke="#b4530a"/>
  <text x="310" y="430" text-anchor="middle" class="nodeTitle">reviewer: detail</text>
  <text x="310" y="444" text-anchor="middle" class="nodeSub">completeness</text>

  <rect x="430" y="410" width="160" height="48" rx="10" class="node" fill="#fff4e5" stroke="#b4530a"/>
  <text x="510" y="430" text-anchor="middle" class="nodeTitle">reviewer: accuracy</text>
  <text x="510" y="444" text-anchor="middle" class="nodeSub">fact-check</text>

  <rect x="630" y="410" width="160" height="48" rx="10" class="node" fill="#fff4e5" stroke="#b4530a"/>
  <text x="710" y="430" text-anchor="middle" class="nodeTitle">reviewer: tone</text>
  <text x="710" y="444" text-anchor="middle" class="nodeSub">style / voice</text>

  <rect x="830" y="410" width="160" height="48" rx="10" class="node" fill="#fff4e5" stroke="#b4530a"/>
  <text x="910" y="430" text-anchor="middle" class="nodeTitle">aggregate_review</text>
  <text x="910" y="444" text-anchor="middle" class="nodeSub">combine verdicts</text>

  <path class="edge" d="M190,434 L230,434"/>
  <path class="edge" d="M390,434 L430,434"/>
  <path class="edge" d="M590,434 L630,434"/>
  <path class="edge" d="M790,434 L830,434"/>

  <rect x="830" y="510" width="160" height="48" rx="10" class="node" fill="#fff4e5" stroke="#b4530a"/>
  <text x="910" y="530" text-anchor="middle" class="nodeTitle">refine</text>
  <text x="910" y="544" text-anchor="middle" class="nodeSub">rewrite draft</text>

  <path class="edge" d="M910,458 L910,510"/>
  <text x="950" y="488" class="edgeLbl">refine</text>

  <!-- refine loops back to combine -->
  <path class="edgeLoop" d="M830,534 C700,534 55,534 55,434 L86,434"/>
  <text x="200" y="526" text-anchor="middle" class="edgeLblRed">loop back</text>

  <!-- ===== Band 4: FINALIZE ===== -->
  <text x="110" y="588" class="band">Finalize</text>

  <rect x="30" y="598" width="160" height="48" rx="10" class="node" fill="#f3e8fd" stroke="#7e22ce"/>
  <text x="110" y="618" text-anchor="middle" class="nodeTitle">finalize</text>
  <text x="110" y="632" text-anchor="middle" class="nodeSub">prepend header</text>

  <rect x="230" y="598" width="160" height="48" rx="10" class="node" fill="#f3e8fd" stroke="#7e22ce"/>
  <text x="310" y="618" text-anchor="middle" class="nodeTitle">render_pdf</text>
  <text x="310" y="632" text-anchor="middle" class="nodeSub">digest.pdf</text>

  <rect x="430" y="598" width="160" height="48" rx="10" class="node" fill="#f3e8fd" stroke="#7e22ce"/>
  <text x="510" y="618" text-anchor="middle" class="nodeTitle">send_notification</text>
  <text x="510" y="632" text-anchor="middle" class="nodeSub">Slack / email</text>

  <path class="edge" d="M190,622 L230,622"/>
  <path class="edge" d="M390,622 L430,622"/>

  <!-- aggregate_review -> finalize (accept path) -->
  <path class="edge" d="M870,458 C700,560 260,585 110,598"/>
  <text x="700" y="575" text-anchor="middle" class="edgeLbl">accept</text>

  <!-- ===== Legend ===== -->
  <g>
    <rect x="30" y="672" width="14" height="14" rx="4" fill="#e1effe" stroke="#1d4ed8"/>
    <text x="52" y="683" class="legend">Ingest</text>

    <rect x="130" y="672" width="14" height="14" rx="4" fill="#e7f6ec" stroke="#15803d"/>
    <text x="152" y="683" class="legend">Generate</text>

    <rect x="245" y="672" width="14" height="14" rx="4" fill="#fff4e5" stroke="#b4530a"/>
    <text x="267" y="683" class="legend">Review</text>

    <rect x="345" y="672" width="14" height="14" rx="4" fill="#f3e8fd" stroke="#7e22ce"/>
    <text x="367" y="683" class="legend">Finalize</text>

    <rect x="450" y="672" width="14" height="14" rx="4" fill="#fde2e2" stroke="#b91c1c"/>
    <text x="472" y="683" class="legend">Failure</text>

    <line x1="560" y1="679" x2="590" y2="679" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="598" y="683" class="legend">conditional / loop edge</text>
  </g>
</svg>