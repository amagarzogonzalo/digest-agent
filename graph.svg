<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" width="1440" height="560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .title{font-size:19px;font-weight:700;fill:#0f172a;letter-spacing:-.01em}
    .subtitle{font-size:12px;fill:#64748b}
    .nodeTitle{font-size:11.5px;font-weight:600;fill:#0f172a}
    .nodeSub{font-size:8.8px;fill:#94a3b8}
    .edgeLbl{font-size:9px;fill:#64748b;font-style:italic}
    .edgeLblRed{font-size:9px;fill:#dc2626;font-style:italic}
    .legend{font-size:10px;fill:#475569}
    .edge{stroke:#cbd5e1;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
    .edgeLoop{stroke:#dc2626;stroke-width:1.3;fill:none;stroke-dasharray:4,3;marker-end:url(#arrowRed)}
    .node{stroke-width:1.3}
  </style>

  <rect x="0" y="0" width="1440" height="560" fill="#ffffff"/>

  <text x="40" y="30" class="title">MR Digest Pipeline</text>
  <text x="40" y="48" class="subtitle">LangGraph StateGraph — evaluator-optimizer model selection → k parallel per-PR loops → chair combine → review committee loop</text>

  <!-- ============ ROW 1 ============ -->
  <rect x="15" y="90" width="150" height="50" rx="10" class="node" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="90" y="111" text-anchor="middle" class="nodeTitle">fetch_github</text>
  <text x="90" y="125" text-anchor="middle" class="nodeSub">activity + diffs</text>

  <rect x="215" y="90" width="150" height="50" rx="10" class="node" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="290" y="111" text-anchor="middle" class="nodeTitle">set_metadata</text>
  <text x="290" y="125" text-anchor="middle" class="nodeSub">uid / version / timestamp</text>

  <rect x="415" y="90" width="150" height="50" rx="10" class="node" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="490" y="113" text-anchor="middle" font-size="10.3" font-weight="600" fill="#0f172a">select_and_test_model</text>
  <text x="490" y="126" text-anchor="middle" class="nodeSub">evaluator–optimizer loop</text>

  <!-- mr_loops: stacked-card motif for internal thread-pool parallelism -->
  <rect x="629" y="76" width="150" height="50" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <rect x="622" y="83" width="150" height="50" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <rect x="615" y="90" width="150" height="50" rx="10" class="node" fill="#ecfdf5" stroke="#059669"/>
  <text x="690" y="111" text-anchor="middle" class="nodeTitle">mr_loops</text>
  <text x="690" y="125" text-anchor="middle" class="nodeSub">k× per-PR loops (thread pool)</text>

  <rect x="815" y="90" width="150" height="50" rx="10" class="node" fill="#ecfdf5" stroke="#059669"/>
  <text x="890" y="111" text-anchor="middle" class="nodeTitle">combine</text>
  <text x="890" y="125" text-anchor="middle" class="nodeSub">merge dives → chair draft</text>

  <rect x="1015" y="90" width="150" height="50" rx="10" class="node" fill="#fffbeb" stroke="#d97706"/>
  <text x="1090" y="111" text-anchor="middle" class="nodeTitle">review_0</text>
  <text x="1090" y="125" text-anchor="middle" class="nodeSub">detail &amp; code substance</text>

  <rect x="1215" y="90" width="150" height="50" rx="10" class="node" fill="#fffbeb" stroke="#d97706"/>
  <text x="1290" y="111" text-anchor="middle" class="nodeTitle">review_1</text>
  <text x="1290" y="125" text-anchor="middle" class="nodeSub">accuracy &amp; groundedness</text>

  <!-- row 1 sequential edges -->
  <path class="edge" d="M165,115 L215,115"/>
  <path class="edge" d="M365,115 L415,115"/>
  <path class="edge" d="M565,115 L615,115"/>
  <text x="590" y="105" text-anchor="middle" class="edgeLbl">pass</text>
  <path class="edge" d="M765,115 L815,115"/>
  <path class="edge" d="M965,115 L1015,115"/>
  <path class="edge" d="M1165,115 L1215,115"/>

  <!-- select_and_test_model self loop (evaluator-optimizer) -->
  <path class="edge" d="M462,90 C462,64 518,64 518,90" marker-end="url(#arrow)"/>
  <text x="490" y="60" text-anchor="middle" class="edgeLbl">continue</text>

  <!-- ============ FAILURE LANE ============ -->
  <rect x="15" y="190" width="150" height="50" rx="10" class="node" fill="#fef2f2" stroke="#dc2626"/>
  <text x="90" y="211" text-anchor="middle" class="nodeTitle">handle_failure</text>
  <text x="90" y="225" text-anchor="middle" class="nodeSub">abort + error summary</text>

  <path class="edgeLoop" d="M90,140 L90,190"/>
  <text x="118" y="168" class="edgeLblRed">error</text>

  <path class="edgeLoop" d="M490,140 L490,165 L140,165 L140,190"/>
  <text x="300" y="158" text-anchor="middle" class="edgeLblRed">fail_exhausted / fail_budget</text>

  <!-- ============ ROW 1 → ROW 2 turn ============ -->
  <path class="edge" d="M1290,140 L1290,290"/>

  <!-- ============ ROW 2 (right → left) ============ -->
  <rect x="1215" y="290" width="150" height="50" rx="10" class="node" fill="#fffbeb" stroke="#d97706"/>
  <text x="1290" y="311" text-anchor="middle" class="nodeTitle">review_2</text>
  <text x="1290" y="325" text-anchor="middle" class="nodeSub">structure, coverage &amp; tone</text>

  <rect x="1015" y="290" width="150" height="50" rx="10" class="node" fill="#fffbeb" stroke="#d97706"/>
  <text x="1090" y="311" text-anchor="middle" class="nodeTitle">aggregate_review</text>
  <text x="1090" y="325" text-anchor="middle" class="nodeSub">score + route decision</text>

  <rect x="815" y="290" width="150" height="50" rx="10" class="node" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="890" y="311" text-anchor="middle" class="nodeTitle">finalize</text>
  <text x="890" y="325" text-anchor="middle" class="nodeSub">prepend deterministic summary</text>

  <rect x="615" y="290" width="150" height="50" rx="10" class="node" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="690" y="311" text-anchor="middle" class="nodeTitle">render_pdf</text>
  <text x="690" y="325" text-anchor="middle" class="nodeSub">digest.pdf</text>

  <rect x="415" y="290" width="150" height="50" rx="10" class="node" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="490" y="311" text-anchor="middle" class="nodeTitle">send_notification</text>
  <text x="490" y="325" text-anchor="middle" class="nodeSub">email notify</text>

  <rect x="40" y="295" width="100" height="40" rx="20" fill="#0f172a"/>
  <text x="90" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">END</text>

  <!-- row 2 sequential edges (right to left) -->
  <path class="edge" d="M1215,315 L1165,315"/>
  <path class="edge" d="M1015,315 L965,315"/>
  <text x="990" y="305" text-anchor="middle" class="edgeLbl">accept / give_up</text>
  <path class="edge" d="M815,315 L765,315"/>
  <path class="edge" d="M615,315 L565,315"/>
  <path class="edge" d="M415,315 L140,315"/>

  <path class="edge" d="M90,240 L90,295"/>

  <!-- ============ REFINE offshoot ============ -->
  <rect x="1015" y="390" width="150" height="50" rx="10" class="node" fill="#fffbeb" stroke="#d97706"/>
  <text x="1090" y="411" text-anchor="middle" class="nodeTitle">refine</text>
  <text x="1090" y="425" text-anchor="middle" class="nodeSub">chair rewrites per critique</text>

  <path class="edgeLoop" d="M1090,340 L1090,390"/>
  <text x="1128" y="368" class="edgeLblRed">refine</text>

  <!-- refine loops back to combine, routed around the outside -->
  <path class="edgeLoop" d="M1165,415 L1400,415 L1400,68 L890,68 L890,90"/>
  <text x="1400" y="245" text-anchor="middle" class="edgeLblRed" transform="rotate(-90 1400 245)">loop back to combine</text>

  <!-- ============ LEGEND ============ -->
  <g>
    <rect x="40" y="480" width="13" height="13" rx="4" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="61" y="490" class="legend">Ingest &amp; model selection</text>

    <rect x="235" y="480" width="13" height="13" rx="4" fill="#ecfdf5" stroke="#059669"/>
    <text x="256" y="490" class="legend">Generate &amp; combine</text>

    <rect x="415" y="480" width="13" height="13" rx="4" fill="#fffbeb" stroke="#d97706"/>
    <text x="436" y="490" class="legend">Review committee</text>

    <rect x="580" y="480" width="13" height="13" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="601" y="490" class="legend">Finalize</text>

    <rect x="680" y="480" width="13" height="13" rx="4" fill="#fef2f2" stroke="#dc2626"/>
    <text x="701" y="490" class="legend">Failure</text>

    <line x1="775" y1="487" x2="805" y2="487" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3"/>
    <text x="813" y="490" class="legend">conditional / loop edge</text>
  </g>
  <text x="40" y="516" class="legend" fill="#94a3b8">mr_loops is a single graph node — the k per-PR dives run concurrently inside it via a ThreadPoolExecutor, not as separate LangGraph nodes.</text>
</svg>